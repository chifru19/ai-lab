name: AI Lab Eval & Integration CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest httpx
      - name: Run FastAPI Integration Tests
        run: python3 lab-stacks/segment-3-hybrid-sync/test_api_integration.py
      - name: Run Segment 4 Edge Evaluation
        run: python3 lab-stacks/segment-4-edge-hpc/evaluate_edge_triage.py
      - name: Run Segment 4 Adversarial Suite
        run: python3 lab-stacks/segment-4-edge-hpc/4gate-soar/evals/test_adversarial_suite.py
